<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/career-gen/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
    <script type="module" crossorigin src="/career-gen/assets/index-uv7lqE3T.js"></script>
    <link rel="stylesheet" crossorigin href="/career-gen/assets/index-BeA8Ug6i.css">
  </head>

  <body>
    <div id="root"></div>


    <!-- ✅ Landbot Chatbot Script -->
    <script>
      window.addEventListener('mouseover', initLandbot, { once: true });
      window.addEventListener('touchstart', initLandbot, { once: true });

      var myLandbot;

      function initLandbot() {
        if (!myLandbot) {
          var s = document.createElement('script');
          s.type = "module";
          s.async = true;

          s.addEventListener('load', function () {
            myLandbot = new Landbot.Livechat({
              configUrl:
                "https://storage.googleapis.com/landbot.online/v3/H-3219563-671TLY9LGWNAHURQ/index.json",
            });
          });

          s.src = "https://cdn.landbot.io/landbot-3/landbot-3.0.0.mjs";

          var x = document.getElementsByTagName("script")[0];
          x.parentNode.insertBefore(s, x);
        }
      }
    </script>
    <!-- ✅ End Landbot Script -->

  </body>
</html>
